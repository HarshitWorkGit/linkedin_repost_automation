<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Synergy AI</title>
    <meta
      name="description"
      content="Synergy AI — a simple home for the latest posts."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="./">Synergy AI</a>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container">
          <p class="eyebrow">Notes</p>
          <h1>A quiet place for posts worth keeping.</h1>
          <p class="lede">
            Short notes from Synergy AI on how we work, what we are learning,
            and the ideas we want to share.
          </p>
        </div>
      </section>

      <section class="posts" aria-labelledby="latest-posts">
        <div class="container">
          <h2 id="latest-posts">Latest Posts</h2>
          <div class="post-grid" data-posts>
            <p class="posts-status">Loading posts…</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>Synergy AI</p>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
